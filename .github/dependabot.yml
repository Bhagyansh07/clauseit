# One npm manifest at the repository root plus the workflow actions.
#
# Minor and patch updates arrive as one grouped pull request per
# ecosystem, capped at three open PRs each. Major updates are ignored
# outright: eslint 9 -> 10 and framer-motion 13 -> 14 each need a
# lint/API pass rather than a merge.
#
# Auto-merge is deliberately absent: every bump lands through
# lint + typecheck + test + build.
version: 2
updates:
- package-ecosystem: "npm"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
