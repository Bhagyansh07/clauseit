<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="ClauseIt — Read the clauses, not the fine print">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143A3A"/>
      <stop offset="1" stop-color="#0F1B1B"/>
    </linearGradient>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6F67"/>
      <stop offset="1" stop-color="#C18F3B"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3BA092"/>
      <stop offset="1" stop-color="#E3C06B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <rect x="0" y="0" width="1200" height="6" fill="url(#accentline)"/>

  <g fill="none" stroke="#1F6F67" stroke-opacity="0.45">
    <rect x="72" y="82" width="300" height="196" rx="14"/>
    <rect x="72" y="82" width="300" height="12" rx="6" fill="#1F6F67" fill-opacity="0.25" stroke="none"/>
  </g>
  <g fill="#F6F3EC" fill-opacity="0.6">
    <rect x="96" y="112" width="180" height="10" rx="5"/>
    <rect x="96" y="136" width="252" height="8" rx="4"/>
    <rect x="96" y="156" width="220" height="8" rx="4"/>
    <rect x="96" y="176" width="240" height="8" rx="4"/>
    <rect x="96" y="212" width="150" height="9" rx="4"/>
    <rect x="96" y="232" width="110" height="9" rx="4"/>
  </g>
  <g fill="none" stroke="#C99A3D" stroke-opacity="0.7">
    <rect x="96" y="190" width="252" height="1.5" rx="0.75"/>
  </g>

  <g font-family="Poppins, Arial, Helvetica, sans-serif">
    <text x="470" y="172" font-size="66" font-weight="bold" fill="#F6F3EC">Clause</text>
    <text x="705" y="172" font-size="66" font-weight="bold" fill="url(#word)">It</text>
  </g>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="470" y="212" font-size="26" fill="#C99A3D">Read the clauses, not the fine print.</text>
    <text x="470" y="246" font-size="16" fill="#F6F3EC" fill-opacity="0.65">Plain-language bilingual (EN/HI) analysis of loans, insurance, rent &amp; job documents.</text>
  </g>

  <g font-family="Inter, Arial, Helvetica, sans-serif">
    <rect x="470" y="268" width="120" height="30" rx="15" fill="none" stroke="#F6F3EC" stroke-opacity="0.25"/>
    <text x="530" y="287" font-size="13" fill="#F6F3EC" fill-opacity="0.7" text-anchor="middle">PDF · Word · Photo</text>
    <rect x="602" y="268" width="132" height="30" rx="15" fill="none" stroke="#F6F3EC" stroke-opacity="0.25"/>
    <text x="668" y="287" font-size="13" fill="#F6F3EC" fill-opacity="0.7" text-anchor="middle">10 free / month</text>
    <rect x="746" y="268" width="150" height="30" rx="15" fill="none" stroke="#E3C06B" stroke-opacity="0.7"/>
    <text x="821" y="287" font-size="13" fill="#C99A3D" text-anchor="middle">English + Hindi</text>
  </g>
